services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: "${DOCKER_BUILD_NETWORK:-host}"
    env_file:
      - path: .env.local
        required: false
    environment:
      # Local Compose must never accidentally select Vercel Blob because .env.local contains
      # variables previously pulled from Vercel.
      VERCEL_ENV: ""
      MIA_LOCAL_MODE: "1"
      MIA_CATALOGUE_PATH: /data/catalogue.sqlite3
      MIA_THREAD_STORE_PATH: /data/mia-agent.sqlite3
      MIA_WORKSPACE_ROOT: /data/workspaces
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000,http://127.0.0.1:3000}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - mia-data:/data
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - >-
          import json, sys, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2));
          sys.exit(0 if data.get('status') == 'ok' else 1)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: "${DOCKER_BUILD_NETWORK:-host}"
    command:
      - /app/backend/.venv/bin/python
      - -m
      - mia_dpp.worker
    env_file:
      - path: .env.local
        required: false
    environment:
      VERCEL_ENV: ""
      MIA_LOCAL_MODE: "1"
      MIA_CATALOGUE_PATH: /data/catalogue.sqlite3
      MIA_THREAD_STORE_PATH: /data/mia-agent.sqlite3
      MIA_WORKSPACE_ROOT: /data/workspaces
      MIA_WORKER_POLL_SECONDS: "${MIA_WORKER_POLL_SECONDS:-1}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - mia-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: "${DOCKER_BUILD_NETWORK:-host}"
      args:
        NEXT_PUBLIC_MIA_API_URL: "${NEXT_PUBLIC_MIA_API_URL:-http://127.0.0.1:8000}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
    env_file:
      - path: .env.local
        required: false
    environment:
      MIA_RESEARCH_DISPATCH: local
      MIA_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_MIA_API_URL: "${NEXT_PUBLIC_MIA_API_URL:-http://127.0.0.1:8000}"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mia-data:
